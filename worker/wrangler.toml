name = "padel-fb-api"
main = "src/index.js"
compatibility_date = "2026-09-08"
workers_dev = true
preview_urls = false

[vars]
ADMIN_USER = "Admin"
GITHUB_OWNER = "diazdiegok"
GITHUB_REPO = "Padel-FB"
SITE_ORIGIN = "https://diazdiegok.github.io,https://padel-fb.vercel.app"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "63f2d6288ea5479a8c29d62f1d5960d0"

[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "FORM_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 3
  period = 60
